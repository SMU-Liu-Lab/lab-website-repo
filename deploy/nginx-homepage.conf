# Merge into the EXISTING HTTPS server block for liulab-genome.com.
# This is a location snippet, NOT a replacement nginx.conf/server block.
# Replace the existing exact-root redirect location; do not duplicate it.
# Start liulab-website.service and check 127.0.0.1:8507 first.

location = / {
    proxy_pass http://127.0.0.1:8507;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /lab-assets/ {
    # No trailing slash on proxy_pass: preserve /lab-assets/... upstream.
    proxy_pass http://127.0.0.1:8507;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Keep all existing /virtualcell/, /chip-search/, /HLA-disease/,
# /RareDipper/, /medreview/, /drugreview/ proxy locations unchanged.
# Keep TLS, Certbot, www handling and HTTP -> HTTPS redirects unchanged.
